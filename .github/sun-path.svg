<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-labelledby="t d">
<title id="t">The sun's altitude over one day, and where each prayer time falls on it</title>
<desc id="d">Makkah, 20 March 2026, Muslim World League angles. Fajr and Isha are where the sun is 18° and 17° below the horizon; sunrise and Maghrib are at the horizon; Dhuhr is at the highest point; Asr is on the way down, when a shadow reaches its object's length plus the noon shadow.</desc>
