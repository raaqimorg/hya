<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="760" viewBox="0 0 1900 760">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#495057"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#212529" text-anchor="start">Hya: from commit to a release</text>
<text x="40" y="86" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#495057" text-anchor="start">The fast gate runs on every push and pull request. A version tag is the only thing that publishes anything.</text>
<rect x="60" y="240" width="260" height="120" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="190.0" y="287.4" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e8590c" text-anchor="middle">Developer</text>
<text x="190.0" y="309.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">pre-commit: cargo fmt --check</text>
<text x="190.0" y="326.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">pre-push: cargo clippy</text>
<rect x="380" y="240" width="240" height="120" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<text x="500.0" y="287.4" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#868e96" text-anchor="middle">GitHub</text>
<text x="500.0" y="309.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">raaqimorg/hya</text>
<text x="500.0" y="326.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">push, pull request, or a tag</text>
<rect x="700" y="115" width="340" height="170" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="870.0" y="169.9" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2f9e44" text-anchor="middle">ci.yml</text>
<text x="870.0" y="191.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">the fast gate, every push and PR</text>
<text x="870.0" y="209.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">rust: fmt, clippy, test,</text>
<text x="870.0" y="226.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">no_std build, cargo-deny</text>
<text x="870.0" y="244.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">js: wasm build, bun test</text>
<rect x="700" y="450" width="340" height="150" rx="14" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<text x="870.0" y="494.9" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#868e96" text-anchor="middle">deep.yml</text>
<text x="870.0" y="517.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">by hand: Actions -&gt; deep -&gt;</text>
<text x="870.0" y="534.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">Run workflow</text>
<text x="870.0" y="552.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">mutants, Kani, fuzz,</text>
<text x="870.0" y="569.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">macOS and Windows too</text>
<rect x="1120" y="250" width="360" height="170" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<text x="1300.0" y="313.7" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6741d9" text-anchor="middle">release.yml</text>
<text x="1300.0" y="335.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">on a tag, vX.Y.Z</text>
<text x="1300.0" y="353.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">re-runs the fast gate, then builds</text>
<text x="1300.0" y="370.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">5 native targets + the macOS DMG</text>
<rect x="1560" y="90" width="300" height="150" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="1710.0" y="134.9" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1971c2" text-anchor="middle">Registries</text>
<text x="1710.0" y="156.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">crates.io: hya-engine,</text>
<text x="1710.0" y="174.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">hya-countries, hya-cli</text>
<text x="1710.0" y="191.9" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">npm: @raaqimorg/hya</text>
<text x="1710.0" y="209.4" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">trusted publishing, no stored token</text>
<rect x="1560" y="420" width="300" height="160" rx="14" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="1710.0" y="478.7" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2f9e44" text-anchor="middle">GitHub Release</text>
<text x="1710.0" y="500.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">the binaries + Hya.dmg +</text>
<text x="1710.0" y="518.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">SHA256SUMS +</text>
<text x="1710.0" y="535.7" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">the changelog section</text>
<path d="M320 240 L320 300 L380 300" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<rect x="313.6" y="287.5" width="72.8" height="25" rx="6" fill="#ffffff" fill-opacity="0.95"/>
<text x="350" y="304.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">git push</text>
<path d="M500 240 L500 200 L700 200" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460.3" y="202.5" width="79.4" height="25" rx="6" fill="#ffffff" fill-opacity="0.95"/>
<text x="500" y="219.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">push / PR</text>
<path d="M500 360 L500 525 L700 525" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<rect x="466.9" y="447.5" width="66.2" height="25" rx="6" fill="#ffffff" fill-opacity="0.95"/>
<text x="500" y="464.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">by hand</text>
<path d="M620 320 L1120 335" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<rect x="827.0" y="307.5" width="86.0" height="25" rx="6" fill="#ffffff" fill-opacity="0.95"/>
<text x="870" y="324.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">tag vX.Y.Z</text>
<path d="M1480 290 L1520 290 L1520 165 L1560 165" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1425.5" y="202.0" width="119.0" height="50" rx="6" fill="#ffffff" fill-opacity="0.95"/>
<text x="1485" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">trusted publish</text>
<text x="1485" y="239.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">(OIDC)</text>
<path d="M1480 400 L1520 400 L1520 500 L1560 500" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1480.3" y="425.0" width="79.4" height="50" rx="6" fill="#ffffff" fill-opacity="0.95"/>
<text x="1520" y="441.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">binaries,</text>
<text x="1520" y="462.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle">checksums</text>
</svg>
